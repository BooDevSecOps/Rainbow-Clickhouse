# Cache SSL Session
ssl_session_cache shared:SSL:50m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Định nghĩa các Upstream để giữ kết nối (Keepalive)
upstream fastapi_backend {
    server 127.0.0.1:8000;
    keepalive 256;
}

upstream go_tracking_backend {
    server 127.0.0.1:8001;
    keepalive 256;
}

# ==============================
# CẤU HÌNH PORT 80 (HTTP)
# ==============================
server {
    listen 80;
    server_name dashboard.ultraffic.info;

    # 1. Điều hướng Track sang Go (Cực nhanh, không block)
    location /track {
        proxy_pass http://go_tracking_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Các route Dashboard/Detail giữ nguyên trỏ về Python (Dùng $scheme để tránh redirect)
    location / {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==============================
# CẤU HÌNH PORT 443 (HTTPS)
# ==============================
server {
    listen 443 ssl http2;
    server_name api.ultraffic.info;

    ssl_certificate /etc/ssl/__ultraffic_info.crt;
    ssl_certificate_key /etc/ssl/__ultraffic_info-private.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # Tối ưu buffer cho traffic lớn
    proxy_buffers 16 32k;
    proxy_buffer_size 64k;

    # 3. Điều hướng Track sang Go (HTTPS)
    location /track {
        proxy_pass http://go_tracking_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Dashboard và các route khác (HTTPS)
    location / {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s; 
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

# Server IP trực tiếp
server {
    listen 80;
    server_name 152.42.197.181; # Thay bằng IP đúng của bạn

    location / {
        return 200 'Never Give Up';
        add_header Content-Type text/plain;
    }
}
