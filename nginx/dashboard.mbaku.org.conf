upstream fastapi_backend {
    server 127.0.0.1:8000;
    keepalive 256;
}

upstream go_tracking_backend {
    server 127.0.0.1:8001;
    keepalive 256;
}

server {
    listen 80;
    server_name dashboard.mbaku.org;

    # Serve tracking JS (cross-origin)
    location = /track.js {
        alias /home/clickHouse-api/track.js;
        add_header Content-Type "application/javascript";
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=1800";
    }

    location /track {
        proxy_pass http://go_tracking_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl http2;
    server_name dashboard.mbaku.org;

    ssl_certificate /etc/ssl/self.crt;
    ssl_certificate_key /etc/ssl/self.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /track.js {
        alias /home/clickHouse-api/track.js;
        add_header Content-Type "application/javascript";
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=1800";
    }

    location /track {
        proxy_pass http://go_tracking_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

# Direct IP fallback
server {
    listen 80;
    server_name 94.237.64.237;
    location / {
        return 200 'Never Give Up';
        add_header Content-Type text/plain;
    }
}
